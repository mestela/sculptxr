<!DOCTYPE html>
<!--
  THE SMALLEST POSSIBLE SESSION, to answer one question: is the Vision Pro distortion ours?

  matt, once the 1x1 framebuffer was fixed: "its rendering, but its really warped and distorted
  ... if i hold the menu in front of me, it is only visible in my right eye ... if i move it away
  from the center, it rapidly distorts towards the edges".

  Everything measurable inside SculptXR on that headset is CORRECT -- framebuffer matches the
  render target, per-eye viewports are the right halves with balanced draw counts, the cameras
  carry a 65mm separation and opposite shear, multiview is off, every uniform block has a big
  enough buffer, and no two shared blocks collide on a binding point. The same code renders
  correctly on a GalaxyXR. So the next question is not "which of our patches" but "is any of our
  code involved at all".

  This page is three and nothing else: a WebGPURenderer on the WebGL backend (forceWebGL is not
  a choice -- the WebGPU backend throws on entering XR), one node material, seven cubes, and the
  stock VRButton. No ThreeXRPatches, no NodeMaterials, no Scene.

    distorted here  -> three + Safari. Our app is a bystander and the fix is upstream or a patch.
    correct here    -> the fault is in our scene, and it can be bisected toward.

  The cubes are a ROW, not one object, because "only visible in my right eye" is a statement
  about position: a row spanning left to right shows at a glance which eye sees what and how the
  distortion grows away from centre.
-->
<html lang="en">
<head><meta charset="utf-8"><title>XR minimal</title>
<style>
  body { margin:0; background:#111; color:#ddd; font:13px ui-monospace,Menlo,monospace; }
  #hud { position:fixed; left:8px; top:8px; white-space:pre; line-height:1.5; z-index:10; }
</style></head>
<body>
<div id="hud">starting…</div>
<script type="module">
import * as THREE from 'three/webgpu';
import { VRButton } from 'three/examples/jsm/webxr/VRButton.js';
import { installDevRelay } from './src/misc/devRelay.js';

installDevRelay();   // so the harness can be questioned without anyone wearing the headset

const hud = document.getElementById('hud');
const renderer = new THREE.WebGPURenderer({ antialias: false, forceWebGL: true });
await renderer.init();
// ?linear=1 REMOVES THE OUTPUT COMPOSITE PASS. three renders the scene to an intermediate
// texture and then blits it to the XR framebuffer with a fullscreen triangle that applies
// sRGB -- `fragColor = sRGBTransferOETF( texture( scene, gl_FragCoord / resolution ) )`. That
// pass is the ONLY structural thing three does here that the raw WebGL2 page (which renders
// correctly on a Vision Pro) does not. With a linear output space and no tone mapping there is
// nothing to convert, so three should draw straight into the layer.
if (/[?&]linear=1/.test(location.search)) {
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  console.log('[xrmin] linear output, no tone mapping — composite pass should be skipped');
}
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
// Exposed so the relay can interrogate three's render-target chain live. The harness exists to
// be questioned; hiding the renderer behind module scope cost a round trip already.
window.renderer = renderer;
window.THREE = THREE;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.6, 0);

// A ROW SPANNING THE VIEW, plus one dead ahead. MeshNormalNodeMaterial needs no lights and
// colours every face differently, so a wrong projection is obvious rather than a guess.
const mat = new THREE.MeshNormalNodeMaterial();
const cubes = [];
for (let i = -3; i <= 3; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), mat);
  m.position.set(i * 0.42, 1.6, -1.2);
  scene.add(m); cubes.push(m);
}
const centre = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
centre.position.set(0, 1.6, -0.6);
scene.add(centre);

// SAFARI REPORTS THE XR FRAMEBUFFER AS 1x1 UNTIL THE FIRST rAF, and three sizes the whole
// session from that value inside setSession. Without this the harness is simply BLACK on a
// Vision Pro and tells us nothing about distortion, which is the thing being tested. Same fix
// as ThreeXRPatches.fixXRLayerSize, inlined so this page stays free of our code.
function fixSize() {
  const xr = renderer.xr, rt = xr._xrRenderTarget;
  if (!rt) return;
  const pl = xr._glProjLayer, bl = xr._glBaseLayer;
  const w = pl ? pl.textureWidth : (bl ? bl.framebufferWidth : 0);
  const h = pl ? pl.textureHeight : (bl ? bl.framebufferHeight : 0);
  if (!(w > 1 && h > 1) || (rt.width === w && rt.height === h)) return;
  renderer._setXRLayerSize(w, h); rt.setSize(w, h);
  console.log('[xrmin] resized ' + w + 'x' + h);
}

{ const gl2 = renderer.backend.gl;
  // WHICH FRAMEBUFFER DOES EACH PASS WRITE TO. If the scene goes to one target and the
  // composite to another, the first is the intermediate -- and its size is the open question.
  const ids = new WeakMap(); let next = 1;
  const fbId = (f) => (f === null ? 0 : (ids.has(f) ? ids.get(f) : (ids.set(f, next), next++)));
  // ONLY WHILE PRESENTING, and counted separately. The first version capped at 300 draws and
  // the pre-session desktop frames ate every one of them, so the table reported the Safari
  // window (1015x1014) as though it were the headset. A sample that fills up before the thing
  // you care about starts is worse than no sample.
  const note = (c) => { try {
    if (!renderer.xr.isPresenting) return;
    const v = gl2.getParameter(gl2.VIEWPORT);
    const f = gl2.getParameter(gl2.FRAMEBUFFER_BINDING);
    const key = 'fb' + fbId(f) + ' vp=' + v[0] + ',' + v[2] + 'x' + v[3] + (c === 3 ? ' [3vtx]' : '');
    (window.__passes = window.__passes || {})[key] = (window.__passes[key] || 0) + 1;
    if (c === 3 && v[2] > 9000) window.__sawComposite = true;
  } catch (e) {} };
  const oa = gl2.drawArrays.bind(gl2), oe = gl2.drawElements.bind(gl2);
  let n = 0;
  gl2.drawArrays = function (m, f, c) { if (n < 400) { n++; note(c); } return oa.apply(gl2, arguments); };
  gl2.drawElements = function (m, c) { if (n < 400) { n++; note(c); } return oe.apply(gl2, arguments); };
  window.__resetPasses = () => { window.__passes = {}; window.__sawComposite = false; n = 0; return 'reset'; }; }
let n = 0;
renderer.setAnimationLoop(() => {
  fixSize();
  const t = performance.now() * 0.001;
  cubes.forEach((c, i) => { c.rotation.y = t + i; c.rotation.x = t * 0.5; });
  centre.rotation.y = -t;
  renderer.render(scene, camera);
  if ((n++ % 60) === 0) {
    const xr = renderer.xr, c = xr.getCamera(), rt = xr._xrRenderTarget;
    window.__xrmin = {
      presenting: xr.isPresenting,
      rt: rt ? rt.width + 'x' + rt.height : null,
      layer: xr._glProjLayer ? 'XRProjectionLayer' : (xr._glBaseLayer ? 'XRWebGLLayer' : '?'),
      composite: window.__sawComposite ? 'YES (fullscreen blit ran)' : 'no (direct to layer)',
      colorSpace: renderer.outputColorSpace + '/tone' + renderer.toneMapping,
      cams: c && c.cameras ? c.cameras.length : 0,
      vp: c && c.cameras ? c.cameras.map((k) => k.viewport.x + ',' + k.viewport.z) : null,
      posX: c && c.cameras ? c.cameras.map((k) => +k.position.x.toFixed(3)) : null
    };
    hud.textContent = 'three ' + THREE.REVISION + '  backend='
      + (renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL')
      + '\n' + JSON.stringify(window.__xrmin, null, 1);
  }
});
console.log('[xrmin] ready, three ' + THREE.REVISION);
</script>
</body></html>
