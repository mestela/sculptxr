<!doctype html>
<html lang='en'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport'
        content='width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0'>
    <title>SculptXR v2.1.0</title>
    <meta name="description" content="SculptXR - WebXR sculpting application">
    <!--
                                                              SculptXR - WebXR sculpting application
                                                              VERSION: v2.1.0
                                                              Target: WebXR (Quest 2/3/Pro)
                                                            -->
    <meta property="og:site_name" content="SculptXR.com" />
    <meta property="og:title" content="SculptXR v2.0.3">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #333;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #vr-button {
            /* Handled by Flexbox container #xr-ui */
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
        }

        #log {
            display: none;
            position: absolute;
            top: 120px; /* Moved down to avoid blocking top UI */
            left: 10px;
            color: lime;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: auto;
            user-select: text;
            max-height: 40%;
            overflow: auto;
            z-index: 1000;
            white-space: pre-wrap;
        }

        /* Container for XR Enter Buttons — lower-left corner.
           Avoids the 380px right sidebar on desktop and Chrome Android's
           center/right bottom popups on the GXR. */
        #xr-ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        .xr-button {
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            min-width: 120px;
        }

        .xr-button:hover {
            background: #005a9e;
        }

        .xr-button:active {
            background: #004578;
        }


    </style>


    <!-- Apple Pencil: disable Scribble on number inputs, prevent hover-scroll on sliders -->
    <style>
      input[type=range]  { touch-action: none; }
      input[type=number] { touch-action: none; }
    </style>
    <script>
      // Stamp inputmode="numeric" on every number input as panels are dynamically created.
      const _patchInput = (el) => {
        if (el.matches?.('input[type=number]')) el.setAttribute('inputmode', 'none');
        el.querySelectorAll?.('input[type=number]').forEach(i => i.setAttribute('inputmode', 'none'));
      };
      new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(_patchInput)))
        .observe(document.body, { childList: true, subtree: true });
    </script>
  <script type="module" crossorigin src="./assets/index-AVua9OcC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C5oyEbpo.css">
</head>

<body>
    <div id="xr-ui">
        <button id="vr-button" class="xr-button">Enter VR</button>
        <button id="ar-button" class="xr-button" style="display: none;">Enter AR</button>
    </div>

    <!-- Warning Dialog if OpenXR is not detected promptly -->
    <div id="xr-warning"
        style="display: none; position: absolute; bottom: 70px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px 25px; border-radius: 8px; font-family: sans-serif; text-align: center; z-index: 9999; border: 1px solid #444; cursor: pointer; opacity: 0; white-space: nowrap;">
        <p style="margin: 0; font-size: 16px;">VR not available. Try restarting your browser?</p>
    </div>

    <!-- Update Available Banner -->
    <div id="xr-update"
        style="display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255, 152, 0, 0.9); color: white; padding: 10px 20px; border-radius: 4px; font-family: sans-serif; font-weight: bold; font-size: 14px; text-align: center; z-index: 10000; cursor: pointer; border: 1px solid #e65100; box-shadow: 0 2px 5px rgba(0,0,0,0.5);"
        onclick="window.location.reload(true);">
        UPDATE AVAILABLE! CLICK HERE OR REFRESH BROWSER. (Current: v1.0.52)
    </div>

    <div id="log"></div>
    <div id="viewport">
        <canvas id='canvas'></canvas>
    </div>

    <!-- Hidden inputs expected by SculptGL (Opacity 0 to avoid display:none blocking) -->
    <input type='file' id='fileopen' multiple
        style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='backgroundopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <div id="build-version"
        style="position: fixed; right: 390px; bottom: 10px; color: #fff; font-family: monospace; font-size: 12px; opacity: 0.5; z-index: 9999; pointer-events: none;"></div>
    <input type='file' id='alphaopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='textureopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='matcapopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='referenceopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />

</body>

</html>
