[package]
name = "voxel_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Forked quadrs (Instant Meshes) with face-group seam steering. See vendor/quadrs
# and docs/quadrs_facegroup_steering.md.
quadrs = { path = "vendor/quadrs" }
baby_shark = { git = "https://github.com/dima634/baby_shark", default-features = false }
nalgebra = "0.34.0"
getrandom = { version = "0.2.17", features = ["custom"] }
rayon = "1.11"
