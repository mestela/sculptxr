    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #333;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #vr-button {
            /* Handled by Flexbox container #xr-ui */
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
        }

        #log {
            position: absolute;
            top: 120px;
            /* Moved down to avoid blocking top UI */
            left: 10px;
            color: lime;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: auto;
            user-select: text;
            max-height: 40%;
            overflow: auto;
            z-index: 1000;
            white-space: pre-wrap;
        }

        /* Container for Centered Buttons */
        #xr-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        .xr-button {
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            min-width: 120px;
        }

        .xr-button:hover {
            background: #005a9e;
        }

        .xr-button:active {
            background: #004578;
        }
    </style>
