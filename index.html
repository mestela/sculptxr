<!doctype html>
<html lang='en'>

<head>
    <meta charset='utf-8' />
    <meta name='viewport'
        content='width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0'>
    <title>SculptXR v3.30.45</title>
    <meta name="description" content="SculptXR - WebXR sculpting application">
    <!--
                                                              SculptXR - WebXR sculpting application
                                                              VERSION: v3.30.45
                                                              Target: WebXR (Quest 2/3/Pro)
                                                            -->
    <meta property="og:site_name" content="SculptXR.com" />
    <meta property="og:title" content="SculptXR v2.0.3">
    <link rel='stylesheet' href='app/css/yagui.css' type='text/css' />
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #333;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* iPad/Safari: let the app own all touch gestures and suppress the
               double-tap-zoom + text-selection "glass" loupe on drag. */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #viewport {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #vr-button {
            /* Handled by Flexbox container #xr-ui */
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
        }

        #log {
            display: none;
            position: absolute;
            top: 120px; /* Moved down to avoid blocking top UI */
            left: 10px;
            color: lime;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            pointer-events: auto;
            user-select: text;
            max-height: 40%;
            overflow: auto;
            z-index: 1000;
            white-space: pre-wrap;
        }

        /* Container for XR Enter Buttons — lower-left corner.
           Avoids the 380px right sidebar on desktop and Chrome Android's
           center/right bottom popups on the GXR. */
        #xr-ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        .xr-button {
            padding: 12px 24px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            min-width: 120px;
        }

        .xr-button:hover {
            background: #005a9e;
        }

        .xr-button:active {
            background: #004578;
        }


    </style>

    <script type="module" src="./src/main.js"></script>

    <!-- Apple Pencil: disable Scribble on number inputs, prevent hover-scroll on sliders -->
    <style>
      input[type=range]  { touch-action: none; }
      input[type=number] { touch-action: none; }
    </style>
    <script>
      // Stamp inputmode="numeric" on every number input as panels are dynamically created.
      const _patchInput = (el) => {
        if (el.matches?.('input[type=number]')) el.setAttribute('inputmode', 'none');
        el.querySelectorAll?.('input[type=number]').forEach(i => i.setAttribute('inputmode', 'none'));
      };
      // Observe documentElement (<html>), not document.body: this script runs in <head>
      // before <body> exists, so document.body is null here and observe() would throw —
      // which also aborted the gesture-suppression listeners below. subtree:true still
      // catches number inputs added anywhere later.
      new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(_patchInput)))
        .observe(document.documentElement, { childList: true, subtree: true });

      // Disable Safari's page pinch-zoom everywhere. iPadOS ignores
      // user-scalable=no, so pinching a panel zoomed/reflowed the whole page (the
      // "grey bar at the bottom" + broken fixed-width layout). The 3D viewport
      // handles its own 2-finger camera via Pointer Events (not these Gesture
      // events), so blocking them doesn't affect camera control.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
        document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    </script>
</head>

<body>
    <div id="xr-ui">
        <button id="vr-button" class="xr-button">Enter VR</button>
        <button id="ar-button" class="xr-button" style="display: none;">Enter AR</button>
    </div>

    <!-- Warning Dialog if OpenXR is not detected promptly -->
    <div id="xr-warning"
        style="display: none; position: absolute; bottom: 70px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 15px 25px; border-radius: 8px; font-family: sans-serif; text-align: center; z-index: 9999; border: 1px solid #444; cursor: pointer; opacity: 0; white-space: nowrap;">
        <p style="margin: 0; font-size: 16px;">VR not available. Try restarting your browser?</p>
    </div>

    <!-- Update Available Banner -->
    <div id="xr-update"
        style="display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255, 152, 0, 0.9); color: white; padding: 10px 20px; border-radius: 4px; font-family: sans-serif; font-weight: bold; font-size: 14px; text-align: center; z-index: 10000; cursor: pointer; border: 1px solid #e65100; box-shadow: 0 2px 5px rgba(0,0,0,0.5);"
        onclick="window.location.reload(true);">
        UPDATE AVAILABLE! CLICK HERE OR REFRESH BROWSER. (Current: v1.0.52)
    </div>

    <div id="log"></div>
    <div id="viewport">
        <canvas id='canvas'></canvas>
    </div>

    <!-- Hidden inputs expected by SculptGL (Opacity 0 to avoid display:none blocking) -->
    <input type='file' id='fileopen' multiple
        style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='backgroundopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <div id="build-version"
        style="position: fixed; right: 390px; bottom: 10px; color: #fff; font-family: monospace; font-size: 12px; opacity: 0.5; z-index: 9999; pointer-events: none;"></div>
    <input type='file' id='alphaopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='textureopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='matcapopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />
    <input type='file' id='referenceopen' style='opacity: 0; position: absolute; pointer-events: none; z-index: -1;' />

    <script type="module">
        import Scene from './src/Scene.js';
        import SculptGL from './src/SculptGL.js';
        import { VERSION } from './src/Version.js';

        window.onload = async () => {
            const nativeLog = console.log;
            // Environment checks
            const isProd = window.location.hostname === 'tokeru.com' && !window.location.pathname.includes('beta');
            window._showDebugLog = false;

            // Expose screenLog globally
            window.screenLog = (msg, color) => {
                if (window._pushFullLog) window._pushFullLog(msg);
                console.log(msg); // Route through intercepted console.log
                if (window.app) {
                    const scene = window.app;
                    if (scene._guiMini) {
                        scene._guiMini.printLog(msg, color);
                    }
                    if (scene._guiXR) {
                        scene._guiXR.printLog(msg, color);
                    }
                }
                
                if (!window._showDebugLog) return;
                const logEl = document.getElementById('log');
                if (logEl) {
                    if (logEl.children.length > 50) {
                        if (logEl.firstChild && logEl.firstChild.tagName === 'BUTTON') {
                            if (logEl.children.length > 1) {
                                logEl.removeChild(logEl.children[1]);
                            }
                        } else {
                            logEl.removeChild(logEl.firstChild);
                        }
                    }
                    const line = document.createElement('div');
                    line.textContent = msg;
                    if (color) line.style.color = color;
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                }
            };
            document.title = `SculptXR ${VERSION}`;

            const buildVersionEl = document.getElementById('build-version');
            if (buildVersionEl) {
                buildVersionEl.textContent = VERSION.split(' - ')[0];
            }

            // Version Header in Log
            const logEl = document.getElementById('log');
            if (logEl) {
                logEl.style.display = window._showDebugLog ? 'block' : 'none';
                const verLine = document.createElement('div');
                verLine.textContent = `SculptXR ${VERSION}`;
                verLine.style.fontWeight = "bold";
                verLine.style.color = "cyan";
                verLine.style.borderBottom = "1px solid #555";
                verLine.style.marginBottom = "5px";
                logEl.appendChild(verLine);
            }

            // Reuse global screenLog
            const cls = console.log;
            const cerr = console.error;

            console.log = function (...args) {
                const msg = args.join(' ');
                if (msg.includes('Resolved profile for') || msg.includes('Connected inputSource:')) return;

                const now = performance.now();
                const delta = now - (window._lastLogTime || now);
                window._lastLogTime = now;

                const scene = window.app;
                const guiXR = scene && scene.getGuiXR ? scene.getGuiXR() : null;
                const debugMode = guiXR && guiXR._uiSettings && guiXR._uiSettings.debugMode;
                if (debugMode && window.screenLog) {
                    if (!args[0] || (typeof args[0] === 'string' && !args[0].startsWith('[ScreenLog]'))) {
                        if (!msg.includes('[Profile]') && !msg.includes('[XR]')) {
                            window.screenLog('[Console] ' + msg);
                        }
                    }
                }

                if (window._pushFullLog) window._pushFullLog(msg);
                if (!window._showDebugLog) {
                    cls.call(console, `[+${delta.toFixed(1)}ms]`, ...args);
                    return;
                }
                // Update on-screen log if available
                const logEl = document.getElementById('log');
                if (logEl) {
                    const msg = args.join(' ');
                    if (!msg.includes('XRRequestFrame') && !msg.includes('Could not find xr_standard_trigger_pressed_min')) {
                        if (logEl.children.length > 50) {

                            if (logEl.firstChild && logEl.firstChild.tagName === 'BUTTON') {
                                if (logEl.children.length > 1) {
                                    logEl.removeChild(logEl.children[1]);
                                }
                            } else {
                                logEl.removeChild(logEl.firstChild);
                            }
                        }
                        const line = document.createElement('div');
                        line.textContent = msg;
                        logEl.appendChild(line);
                        logEl.scrollTop = logEl.scrollHeight;
                    }
                }
                cls.apply(console, args);
            };

            console.error = function (...args) {
                const msg = args.join(' ');
                const logEl = document.getElementById('log');
                if (logEl) {
                    if (logEl.children.length > 50) {
                        if (logEl.firstChild && logEl.firstChild.tagName === 'BUTTON') {
                            if (logEl.children.length > 1) {
                                logEl.removeChild(logEl.children[1]);
                            }
                        } else {
                            logEl.removeChild(logEl.firstChild);
                        }
                    }
                    const line = document.createElement('div');
                    line.textContent = "[ERROR] " + msg;
                    line.style.color = "red";
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                }
                cerr.apply(console, args);
            };

            window.addEventListener('error', function (e) {
                const logEl = document.getElementById('log');
                if (logEl) {
                    const line = document.createElement('div');
                    line.textContent = "UNCAUGHT: " + e.message + " at " + e.filename + ":" + e.lineno;
                    line.style.color = "red";
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                }
            });

            window.addEventListener('unhandledrejection', function (e) {
                const logEl = document.getElementById('log');
                if (logEl) {
                    const line = document.createElement('div');
                    line.textContent = "REJECT: " + e.reason;
                    line.style.color = "orange";
                    logEl.appendChild(line);
                    logEl.scrollTop = logEl.scrollHeight;
                }
            });

            // Full log buffer, copied on demand. CAPPED — it was unbounded, and its own comment
            // said so. Anything that logs per frame (a trace flag, a perf counter, a chatty
            // tool) grew it without limit for the life of the session, which is memory and GC
            // pressure bought for scrollback nobody reads past a few thousand lines.
            window._fullLogBuffer = [];
            window._fullLogCap = 4000;
            window._pushFullLog = (msg) => {
                const b = window._fullLogBuffer;
                if (!b) return;
                b.push(msg);
                // Trimmed in one block rather than shifting per push: shift() on a long array
                // is O(n), so trimming on every line would cost more than the leak did.
                if (b.length > window._fullLogCap * 1.25) b.splice(0, b.length - window._fullLogCap);
            };

            // Add Copy Button (Ensured logic)
            const logContainer = document.getElementById('log');
            if (logContainer) {
                const btnCopy = document.createElement('button');
                btnCopy.textContent = "Copy Log";
                btnCopy.style.position = "sticky";
                btnCopy.style.top = "0";
                btnCopy.style.right = "0";
                btnCopy.style.float = "right";
                btnCopy.style.background = "#444";
                btnCopy.style.color = "#fff";
                btnCopy.style.border = "1px solid #666";
                btnCopy.style.cursor = "pointer";
                btnCopy.style.padding = "2px 5px";
                btnCopy.style.fontSize = "12px";
                btnCopy.style.opacity = "0.7";
                btnCopy.style.zIndex = "1001";

                btnCopy.onclick = () => {
                    const text = window._fullLogBuffer.join('\n');
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(() => {
                            btnCopy.textContent = "Copied!";
                            setTimeout(() => btnCopy.textContent = "Copy Log", 1000);
                        });
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        btnCopy.textContent = "Copied!";
                        setTimeout(() => btnCopy.textContent = "Copy Log", 1000);
                    }
                };
                logContainer.prepend(btnCopy);
            }

            if (window._showDebugLog && window.screenLog) window.screenLog(`-- SculptXR Beta ${VERSION} --`, "lime");

            // Check HTTPS
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                console.warn("WebXR requires HTTPS or localhost!");
                console.warn("Current: " + location.href);
            }

            try {
                // Dynamic import to catch module errors
                // const module = await import('Scene'); // Only load Scene for now
                // const SceneClass = module.default;

                // const app = new SceneClass(); // Instantiate minimal Scene
                const module = await import('./src/SculptGL.js');
                const SculptGL = module.default;

                const app = new SculptGL();
                app.start();
                window.app = app; // For debugging
                // console.log("SculptGL started successfully.");
            } catch (e) {
                console.error("CRITICAL: Failed to load SculptGL module:", e);
                console.error(e.message);
                return;
            }

            // VR/AR Button Logic
            const btnVR = document.getElementById('vr-button');
            const btnAR = document.getElementById('ar-button');

            // Quick timeout to warn users if browser hasn't registered WebXR
            const isIpad = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            setTimeout(() => {
                if (!isIpad && btnVR && btnVR.style.display === 'none' && btnAR && btnAR.style.display === 'none') {
                    const warning = document.getElementById('xr-warning');
                    if (warning) {
                        warning.style.display = 'block';
                        // Trigger reflow to enable transition
                        warning.offsetHeight;
                        warning.style.transition = 'opacity 0.25s';
                        warning.style.opacity = '1';
                        
                        // Dismiss on click
                        const dismiss = () => {
                            warning.style.transition = 'opacity 0.1s';
                            warning.style.opacity = '0';
                            setTimeout(() => { warning.style.display = 'none'; }, 100);
                        };
                        warning.addEventListener('click', dismiss);
                        
                        // Auto dismiss after 5.25s (0.25s fade in + 5s hold)
                        setTimeout(() => {
                            if (warning.style.opacity !== '0') {
                                warning.style.transition = 'opacity 0.25s';
                                warning.style.opacity = '0';
                                setTimeout(() => { warning.style.display = 'none'; }, 250);
                            }
                        }, 5250);
                    }
                }
            }, 2000);

            // Check VR
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        btnVR.textContent = 'Enter VR';
                        btnVR.addEventListener('click', () => onEnterVR('immersive-vr'));
                    } else {
                        btnVR.style.display = 'none';
                    }
                });

                // Check AR
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (window.screenLog) {
                        // window.screenLog("AR Supported: " + supported, supported ? "lime" : "orange");
                    }
                    if (supported) {
                        btnAR.textContent = 'Enter AR';
                        btnAR.style.display = 'block'; // Force block
                        btnAR.addEventListener('click', () => onEnterVR('immersive-ar'));
                    } else {
                        btnAR.style.display = 'none';
                        // if (window.screenLog) window.screenLog("Hiding AR Button (Not Supported)", "orange");
                    }
                }).catch((err) => {
                    console.error(err);
                    if (window.screenLog) window.screenLog("AR Check Error: " + err, "red");
                });
            } else {
                if (btnVR) btnVR.style.display = 'none';
                if (btnAR) btnAR.style.display = 'none';
            }



            async function onEnterVR(sessionType) {
                // console.log(`[USER EVENT] 'Enter VR' button literally clicked by user. Type: ${sessionType}`);
                // if (window.screenLog) window.screenLog(`[USER EVENT] Enter VR clicked: ${sessionType}`, "magenta");
                if (app && app.startXRSession) {
                    // console.log("[USER EVENT] Invoking app.startXRSession...");
                    app.startXRSession(sessionType);
                } else {
                    // console.error("[USER EVENT] App not ready or startXRSession missing", app);
                    if (window.screenLog) window.screenLog("[USER EVENT ERR] App not ready!", "red");
                }
            }

            // Touch to Mouse Mapper for UI elements (iPad support)
            (function() {
                const mainCanvas = document.getElementById('canvas');
                let activeTouch = null;
                let activeTouchTarget = null;

                function isOrHasSliderParent(el) {
                    while (el && el !== document.body) {
                        if (el.classList && el.classList.contains('gui-slider')) return true;
                        el = el.parentElement;
                    }
                    return false;
                }

                document.addEventListener('touchstart', function(e) {
                    if (e.target === mainCanvas) return;
                    if (activeTouch !== null) return; // Only handle one touch
                    
                    const isSlider = isOrHasSliderParent(e.target);
                    const isTimelineCanvas = e.target.tagName === 'CANVAS' && e.target !== mainCanvas;
                    
                    if (!isSlider && !isTimelineCanvas) {
                        // Let it fall through to native scrolling!
                        return;
                    }
                    
                    activeTouch = e.touches[0];
                    activeTouchTarget = e.target;
                    dispatchMouseEvent('mousedown', activeTouch, activeTouchTarget);
                    e.preventDefault();
                }, { passive: false });

                document.addEventListener('touchmove', function(e) {
                    if (activeTouch === null) return;
                    
                    let touch = null;
                    for (let i = 0; i < e.touches.length; i++) {
                        if (e.touches[i].identifier === activeTouch.identifier) {
                            touch = e.touches[i];
                            break;
                        }
                    }
                    if (!touch) return;

                    dispatchMouseEvent('mousemove', touch, activeTouchTarget);
                    e.preventDefault();
                }, { passive: false });

                document.addEventListener('touchend', function(e) {
                    if (activeTouch === null) return;
                    
                    let touch = null;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === activeTouch.identifier) {
                            touch = e.changedTouches[i];
                            break;
                        }
                    }
                    if (!touch) return;

                    dispatchMouseEvent('mouseup', touch, activeTouchTarget);
                    activeTouch = null;
                    e.preventDefault();
                }, { passive: false });

                function dispatchMouseEvent(type, touch, target) {
                    const mouseEvent = new MouseEvent(type, {
                        bubbles: true,
                        cancelable: true,
                        view: window,
                        clientX: touch.clientX,
                        clientY: touch.clientY,
                        screenX: touch.screenX,
                        screenY: touch.screenY,
                        which: 1
                    });
                    target.dispatchEvent(mouseEvent);
                }
            })();
        };
    </script>
</body>

</html>
